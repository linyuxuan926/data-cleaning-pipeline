name: verify
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B verify
        working-directory: backend

  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: engine/requirements*.txt
      - name: Python suite including disk rules and execution isolation
        run: python -m pip install -r requirements-dev.txt && python -m pip check && python -m pytest -q
        working-directory: engine
      - run: python scripts/generate_openapi.py --check

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: frontend

  integration:
    needs: [backend, engine, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: data-cleaning-pipeline-v3-next
      WEB_PORT: '8089'
      BASE_URL: http://localhost:8089
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - run: python scripts/bootstrap.py
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: python scripts/smoke_test.py --base-url http://localhost:8089
      - run: python scripts/acceptance_v3.py --base-url http://localhost:8089
      - run: python scripts/acceptance_v3_disk.py --base-url http://localhost:8089
      - run: npm ci && npx playwright install --with-deps chromium && npm test
        working-directory: tests/browser
      - if: failure()
        run: docker compose logs --tail=150 > compose-failure.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-evidence
          path: |
            .test-output/browser/
            .test-output/browser-v2/
            .test-output/browser-v3/
            .test-output/browser-v3-upload-resume/
            .test-output/browser-disk-v3/
            .test-output/v3-next-disk-acceptance.json
            compose-failure.log
      - if: always()
        run: docker compose down
