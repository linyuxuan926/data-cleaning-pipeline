name: data-cleaning-pipeline

x-engine-environment: &engine-environment
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Run python scripts/bootstrap.py first}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Run python scripts/bootstrap.py first}
  MINIO_BUCKET: cleaning
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USER: ${RABBITMQ_USER:-cleaning}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Run python scripts/bootstrap.py first}
  JAVA_API_URL: http://backend:8080
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Run python scripts/bootstrap.py first}
  WORKER_QUEUE: cleaning.tasks
  EXECUTION_TIMEOUT_SECONDS: ${EXECUTION_TIMEOUT_SECONDS:-1800}
  CANCEL_GRACE_SECONDS: ${CANCEL_GRACE_SECONDS:-10}
  SCRATCH_ROOT: /tmp/cleaning-attempts
  SCRATCH_RETENTION_SECONDS: ${SCRATCH_RETENTION_SECONDS:-3600}
  DISK_BATCH_ROWS: ${DISK_BATCH_ROWS:-1000}
  MAX_SCRATCH_BYTES: ${MAX_SCRATCH_BYTES:-1073741824}

services:
  mysql:
    image: mysql:8.0.40
    environment:
      MYSQL_DATABASE: cleaning
      MYSQL_USER: cleaning
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run python scripts/bootstrap.py first}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run python scripts/bootstrap.py first}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u cleaning -D cleaning -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  minio:
    build: ./infra/minio
    image: data-cleaning-pipeline-minio:2024.10.13
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Run python scripts/bootstrap.py first}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Run python scripts/bootstrap.py first}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-cleaning}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run python scripts/bootstrap.py first}
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 40
    restart: unless-stopped

  python-api:
    build: ./engine
    image: data-cleaning-pipeline-engine:1.0.0
    command: ["uvicorn", "cleaning.api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--limit-concurrency", "32"]
    environment: *engine-environment
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    image: data-cleaning-pipeline-backend:1.0.0
    environment:
      <<: *engine-environment
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cleaning
      DB_USER: cleaning
      DB_PASSWORD: ${DB_PASSWORD:?Run python scripts/bootstrap.py first}
      PYTHON_API_URL: http://python-api:8000
      UPLOAD_DIR: /tmp/uploads
      PORT: 8080
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:?Run python scripts/bootstrap.py first}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Run python scripts/bootstrap.py first}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError
    volumes:
      - uploads:/tmp/uploads
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      python-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  worker:
    image: data-cleaning-pipeline-engine:1.0.0
    build: ./engine
    command: ["python", "-m", "cleaning.worker"]
    environment: *engine-environment
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import time; p=Path('/tmp/cleaning-worker-heartbeat'); assert p.exists() and time.time()-p.stat().st_mtime<45"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  frontend:
    build: ./frontend
    image: data-cleaning-pipeline-frontend:1.0.0
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  minio-data:
  rabbit-data:
  uploads:
