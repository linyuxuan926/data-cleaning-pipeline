# Optional host ports for developing the application processes outside Docker.
# docker compose -f compose.yaml -f compose.dev.yaml up -d mysql minio rabbitmq
services:
  mysql:
    ports: ["127.0.0.1:3306:3306"]
  minio:
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
  rabbitmq:
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
