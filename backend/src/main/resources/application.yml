server:
  port: ${PORT:8080}
  error:
    include-message: never
  tomcat:
    max-swallow-size: 9MB
logging:
  pattern:
    level: '%5p [requestId=%X{requestId:-}]'
spring:
  task:
    scheduling:
      pool:
        size: 2
  application:
    name: data-cleaning-pipeline
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cleaning}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    username: ${DB_USER:cleaning}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USER:cleaning}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    rabbit:
      enabled: true
cleaning:
  internal-token: ${INTERNAL_API_TOKEN}
  python-api-url: ${PYTHON_API_URL:http://localhost:8000}
  minio-endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  minio-access-key: ${MINIO_ACCESS_KEY}
  minio-secret-key: ${MINIO_SECRET_KEY}
  minio-bucket: ${MINIO_BUCKET:cleaning}
  upload-dir: ${UPLOAD_DIR:./var/uploads}
  scheduler-enabled: true
  execution-timeout-seconds: ${EXECUTION_TIMEOUT_SECONDS:1800}
  cancel-grace-seconds: ${CANCEL_GRACE_SECONDS:10}
  registration-enabled: ${REGISTRATION_ENABLED:true}
